<html lang="vi">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#007bff" />

  <body>
    <div id="root">
      <div style="font-family: Arial, sans-serif; padding: 24px; color: #202124;">
        Đang tải ứng dụng quản lý thuê xe...
      </div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<div style="font-family: Arial, sans-serif; padding: 24px; color: #202124;"><h1 style="font-size: 22px;">Ứng dụng đang gặp lỗi khi tải</h1><p style="color:#a50e0e;">' + event.message + '</p><button onclick="localStorage.removeItem(\\'web-thue-xe-cars\\'); location.reload();" style="height:40px;padding:0 14px;border:1px solid #dadce0;border-radius:8px;background:#1a73e8;color:white;">Xóa dữ liệu tạm và tải lại</button></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
